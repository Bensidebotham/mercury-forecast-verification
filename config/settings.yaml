# Settlement stations, from api.weather.gov/stations/<id>. Forecasts are taken
# at the station's own coordinates, because each venue settles on one station.
stations:
  KNYC: {lat: 40.7833, lon: -73.9667, tz: "America/New_York", name: "New York City, Central Park"}
  KLGA: {lat: 40.7792, lon: -73.8800, tz: "America/New_York", name: "New York, La Guardia Airport"}
  KMDW: {lat: 41.7842, lon: -87.7553, tz: "America/Chicago", name: "Chicago Midway Airport"}
  KORD: {lat: 41.9797, lon: -87.9044, tz: "America/Chicago", name: "Chicago O'Hare International Airport"}
  KMIA: {lat: 25.7906, lon: -80.3164, tz: "America/New_York", name: "Miami International Airport"}
  KLAX: {lat: 33.9381, lon: -118.3889, tz: "America/Los_Angeles", name: "Los Angeles International Airport"}
  KSFO: {lat: 37.6196, lon: -122.3656, tz: "America/Los_Angeles", name: "San Francisco International Airport"}

# The same city can settle on different stations per venue: Kalshi NYC uses
# the Central Park CLI (KNYC), Polymarket NYC uses LaGuardia (KLGA).
venues:
  kalshi:
    - {city: "New York", series: "KXHIGHNY", station: "KNYC"}
    - {city: "Chicago", series: "KXHIGHCHI", station: "KMDW"}
    - {city: "Miami", series: "KXHIGHMIA", station: "KMIA"}
    - {city: "Los Angeles", series: "KXHIGHLAX", station: "KLAX"}
  polymarket:
    - {city: "New York", slug: "nyc", station: "KLGA"}
    - {city: "Chicago", slug: "chicago", station: "KORD"}
    - {city: "Miami", slug: "miami", station: "KMIA"}
    - {city: "Los Angeles", slug: "los-angeles", station: "KLAX"}
    - {city: "San Francisco", slug: "san-francisco", station: "KSFO"}

# Live ensemble-kernel model (ens_kernel_v1). Live-only: no ensemble archive exists.
ensemble:
  kernel_sigma_f: 1.5        # Gaussian kernel width per ensemble member, °F
  lock_hour_local: 18        # after this local hour the day's max is treated as final
  obs_buffer_f: 1.0          # hourly METAR can miss the peak between obs
  locked_bias_f: 0.0
  locked_sigma_f: 0.75

# Fixed local clock times relative to the target date D. Kalshi ladders open
# around 10:00 ET on D-1 and close at midnight ending D, so longer leads don't exist.
evaluation:
  lead_points:
    - {name: "D-1 12:00", day_offset: -1, hour: 12}
    - {name: "D 07:00", day_offset: 0, hour: 7}
  tolerance_hours: 2

storage:
  # Overridden by the DATABASE_URL environment variable (Neon in CI).
  url: "data/verify.sqlite3"
