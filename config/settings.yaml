# Cities scored against Kalshi and Polymarket daily-high temperature markets.
# Stations are the official settlement stations (NWS CLI daily maximum).
forecast:
  cities:
    # NYC settles on KNYC (Central Park) via the NWS CLI. Using the LaGuardia
    # airport station instead biased observations up to 4.5F off settlement.
    - name: "New York"
      station: "KNYC"
      lat: 40.779
      lon: -73.969
      tz: "America/New_York"
      unit: "F"
      aliases: ["NYC", "New York City", "New York"]
    - name: "San Francisco"
      station: "KSFO"
      lat: 37.620
      lon: -122.365
      tz: "America/Los_Angeles"
      unit: "F"
      aliases: ["San Francisco", "SF"]
    - name: "Miami"
      station: "KMIA"
      lat: 25.788
      lon: -80.317
      tz: "America/New_York"
      unit: "F"
      aliases: ["Miami"]
    - name: "Chicago"
      station: "KMDW"
      lat: 41.786
      lon: -87.752
      tz: "America/Chicago"
      unit: "F"
      aliases: ["Chicago"]
    - name: "Los Angeles"
      station: "KLAX"
      lat: 33.938
      lon: -118.389
      tz: "America/Los_Angeles"
      unit: "F"
      aliases: ["Los Angeles", "LA"]
  kernel_sigma_f: 1.5        # smoothing kernel width per ensemble member, °F
  lock_hour_local: 18        # hard fallback: after this local hour, day is locked
  # Jun-11 settlements showed airport-station obs match resolution within
  # rounding — small buffer for missed peaks between hourly obs, no bias.
  obs_buffer_f: 1.0
  locked_bias_f: 0.0
  locked_sigma_f: 0.75

verify:
  db_path: "data/verify.sqlite3"
  lead_buckets: [72, 48, 24, 6]   # hours before market close to score at
  kalshi_cities: ["New York", "Los Angeles", "Chicago", "Miami"]
  include_polymarket: true
