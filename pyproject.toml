[project]
name = "weather-vs-market"
version = "0.2.0"
description = "Score weather-model probabilities against Kalshi and Polymarket temperature markets"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "pyarrow",
]

[project.scripts]
wvm = "weather_vs_market.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_vs_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
