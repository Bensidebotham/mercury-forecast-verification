[project]
name = "weather-vs-market"
version = "0.3.0"
description = "Score weather-model probabilities against Kalshi and Polymarket temperature markets"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "pyarrow",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
wvm = "weather_vs_market.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_vs_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["weather_vs_market", "conftest"]
